services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lingshu:lingshu@postgres:5432/lingshu
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lingshu:lingshu@rabbitmq:5672/
      MINIO_ENDPOINT: minio:9000
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_started }

  celery-worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: celery -A src.tasks.celery_app.celery_app worker -l INFO -Q ai,workorder,celery
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://lingshu:lingshu@postgres:5432/lingshu
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lingshu:lingshu@rabbitmq:5672/
    depends_on: [postgres, redis, rabbitmq]

  celery-beat:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: celery -A src.tasks.celery_app.celery_app beat -l INFO
    env_file: ../.env
    environment:
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://lingshu:lingshu@rabbitmq:5672/
    depends_on: [redis, rabbitmq]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: lingshu
      POSTGRES_USER: lingshu
      POSTGRES_PASSWORD: lingshu
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U lingshu"], interval: 5s, timeout: 3s, retries: 10 }

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lingshu
      RABBITMQ_DEFAULT_PASS: lingshu
    ports: ["15672:15672"]
    volumes: ["rabbitmq_data:/var/lib/rabbitmq"]
    healthcheck: { test: ["CMD", "rabbitmq-diagnostics", "ping"], interval: 10s, timeout: 5s, retries: 10 }

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [api]

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  minio_data:
